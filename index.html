<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hair Studio Vintage</title>
  <meta name="description" content="札幌市中央区の理美容室 Hair Studio Vintage。ヴィンテージで洗練された贅沢な空間と極上のカット技術を提供します。">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- favicon (もしあれば。なければ既存のものかロゴを使用) -->
  <link rel="icon" href="public/logo.png" type="image/png">
</head>
<body>

  <!-- ナビゲーションヘッダー -->
  <header>
    <a href="index.html" class="logo-container" id="nav-logo-link">
      <img src="public/logo.png" alt="Hair Studio Vintage" class="logo">
    </a>
    
    <nav>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="access.html">Access</a></li>
      </ul>
    </nav>
    
    <div class="burger" id="mobile-menu-burger">
      <div class="line1"></div>
      <div class="line2"></div>
      <div class="line3"></div>
    </div>
  </header>

  <!-- メインビジュアル / ヒーローセクション -->
  <main>
    <section class="hero-container">
      <video class="hero-video" autoplay loop muted playsinline webkit-playsinline id="bg-video">
        <source src="public/vintage.mp4" type="video/mp4">
      </video>
      <div class="hero-overlay"></div>
      
      <div class="hero-content">
        <p class="hero-subtitle">V I N T A G E</p>
        <h1 class="hero-title">HAIR STUDIO</h1>
        <div class="hero-cta">
          <a href="access.html" class="btn-premium" id="cta-access">Access</a>
        </div>
      </div>
    </section>
  </main>

  <!-- 共通フッター -->
  <footer>
    <div class="footer-content">
      <div class="footer-logo">
        <h2>VINTAGE <span>HAIR STUDIO</span></h2>
      </div>
      <div class="footer-info">
        <p>住所: 札幌市中央区南9条西20丁目3-12</p>
        <p>電話番号: 011-533-1824</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Hair Studio Vintage. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="js/main.js"></script>
</body>
</html>
