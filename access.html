<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access - Hair Studio Vintage</title>
  <meta name="description" content="Hair Studio Vintageへのアクセス情報。札幌市中央区の店舗住所、電話番号、周辺マップを掲載しております。">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="public/logo.png" type="image/png">
</head>
<body>

  <!-- ナビゲーションヘッダー -->
  <header>
    <a href="index.html" class="logo-container" id="nav-logo-link">
      <img src="public/logo.png" alt="Hair Studio Vintage" class="logo">
    </a>
    
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="access.html" class="active">Access</a></li>
      </ul>
    </nav>
    
    <div class="burger" id="mobile-menu-burger">
      <div class="line1"></div>
      <div class="line2"></div>
      <div class="line3"></div>
    </div>
  </header>

  <!-- ページヘッダー -->
  <div class="page-header">
    <h1 class="page-title">ACCESS</h1>
    <p class="page-subtitle">Location & Contact</p>
  </div>

  <!-- メインコンテンツ -->
  <main class="section-container">
    <div class="access-flex">
      
      <!-- 店舗情報パネル -->
      <section class="access-info-panel reveal" id="access-details">
        <div class="info-group">
          <h2 class="info-label">Address</h2>
          <p class="info-value">〒064-0809<br>札幌市中央区南9条西20丁目3-12</p>
        </div>

        <div class="info-group">
          <h2 class="info-label">Phone Number</h2>
          <p class="info-value phone">011-533-1824</p>
        </div>

      </section>

      <!-- Google Maps パネル -->
      <div class="map-container reveal" id="access-map" style="animation-delay: 0.2s;">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2915.7562868846394!2d141.32435007711463!3d43.0465427711379!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5f0b29f0504d17e7%3A0x643e43caa3877b43!2svintage!5e0!3m2!1sja!2sjp!4v1716544900000!5m2!1sja!2sjp"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Hair Studio Vintage Google Map"
        ></iframe>
      </div>

    </div>
  </main>

  <!-- 共通フッター -->
  <footer>
    <div class="footer-content">
      <div class="footer-logo">
        <h2>VINTAGE <span>HAIR STUDIO</span></h2>
      </div>
      <div class="footer-info">
        <p>住所: 札幌市中央区南9条西20丁目3-12</p>
        <p>電話番号: 011-533-1824</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Hair Studio Vintage. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="js/main.js"></script>
</body>
</html>
